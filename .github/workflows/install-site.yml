name: Install website files
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-site.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the package and commit the static site
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/conversation-pieces.zip"
          cat site-1.txt site-2.txt | base64 --decode > "$archive"
          echo "9b874abbdca0c7ee6fd4d9cad4ef8520444f58fd0ef3ae3c878984f515bcefeb  $archive" | sha256sum --check
          unzip -q "$archive"
          git add -- index.html style.css gallery.js gallery-shelves.webp shop-interior.webp shop-display.webp jewelers-bench.webp main-street.webp shop-logo.webp shop-emblem.webp
          git rm -- site-1.txt site-2.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish Conversation Pieces with Jaime's story and original photography"
          git push origin HEAD:main
